name: One-shot updater settings patch

on:
  push:
    branches:
      - feature/m0.9-android-self-update

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m0.9-android-self-update
          fetch-depth: 0
      - name: Add Check for Update to Settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/android/app/src/main/java/com/telemetry/app/MainActivity.kt')
          s = p.read_text()
          if 'onCheckUpdate = ::openUpdateGate' in s:
              print('settings update patch already present')
              raise SystemExit(0)

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          once('import android.Manifest\n', 'import android.Manifest\nimport android.content.Intent\n', 'intent import')
          once('import com.telemetry.app.transport.TelemetryGattTransport\n', 'import com.telemetry.app.transport.TelemetryGattTransport\nimport com.telemetry.app.update.UpdateGateActivity\n', 'update gate import')
          once(
              '                    onSettings = { screen = AppScreen.SETTINGS },\n                    onSos = { screen = AppScreen.SOS },',
              '                    onSettings = { screen = AppScreen.SETTINGS },\n                    onCheckUpdate = ::openUpdateGate,\n                    onSos = { screen = AppScreen.SOS },',
              'app callback'
          )
          once(
              '    private fun openNearby() {\n',
              '    private fun openUpdateGate() {\n        startActivity(Intent(this, UpdateGateActivity::class.java).apply {\n            action = "com.telemetry.preview.CHECK_UPDATE"\n        })\n    }\n\n    private fun openNearby() {\n',
              'open update method'
          )
          once(
              '    onSettings: () -> Unit,\n    onSos: () -> Unit,',
              '    onSettings: () -> Unit,\n    onCheckUpdate: () -> Unit,\n    onSos: () -> Unit,',
              'TelemetryAppV2 signature'
          )
          once(
              '                onSettings = onSettings\n            )\n            AppScreen.SOS -> SosScreen(',
              '                onSettings = onSettings,\n                onCheckUpdate = onCheckUpdate\n            )\n            AppScreen.SOS -> SosScreen(',
              'settings call'
          )
          once(
              'private fun SettingsScreen(\n    state: M1BUiState,\n    onMessages: () -> Unit,\n    onNearby: () -> Unit,\n    onNetwork: () -> Unit,\n    onSettings: () -> Unit\n) {',
              'private fun SettingsScreen(\n    state: M1BUiState,\n    onMessages: () -> Unit,\n    onNearby: () -> Unit,\n    onNetwork: () -> Unit,\n    onSettings: () -> Unit,\n    onCheckUpdate: () -> Unit\n) {',
              'settings signature'
          )
          once(
              '            SettingCard(\n                "Build",\n                "Telemetry Android 0.4.0 · UI v2"\n            )\n',
              '            SettingCard(\n                "Build",\n                "Telemetry Android ${BuildConfig.VERSION_NAME} · Preview channel"\n            )\n            Spacer(Modifier.height(10.dp))\n            PrimaryButton(\n                "Check for Update",\n                onCheckUpdate,\n                Modifier.fillMaxWidth()\n            )\n',
              'settings update button'
          )
          p.write_text(s)
          print('Settings update button patch applied')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/android/app/src/main/java/com/telemetry/app/MainActivity.kt
          git commit -m 'feat(update): add in-app update entry in Settings' || exit 0
          git push origin HEAD:feature/m0.9-android-self-update
