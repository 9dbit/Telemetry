name: One-shot media multihop patch

on:
  push:
    branches:
      - feature/m1.5a-secure-media-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1.5a-secure-media-foundation
          fetch-depth: 0
      - name: Route TMC1 through TMR1 and correct mesh TTL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/android/app/src/main/java/com/telemetry/app/media/AndroidMediaTransferController.kt')
          s = p.read_text()
          marker = 'private const val MESH_FRAME_TTL_MS = 10L * 60_000'
          if marker in s:
              print('media multihop patch already present')
              raise SystemExit(0)

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          once(
              '        private const val TRANSFER_TTL_MS = 7L * 24 * 60 * 60_000\n        private const val CONTROL_RETRY_MS = 10_000L',
              '        private const val TRANSFER_TTL_MS = 7L * 24 * 60 * 60_000\n        private const val MESH_FRAME_TTL_MS = 10L * 60_000\n        private const val CONTROL_RETRY_MS = 10_000L',
              'mesh frame ttl constant'
          )
          if s.count('ttlMs = TRANSFER_TTL_MS') != 2:
              raise SystemExit(f'expected 2 control TTL uses, got {s.count("ttlMs = TRANSFER_TTL_MS")}')
          s = s.replace('ttlMs = TRANSFER_TTL_MS', 'ttlMs = MESH_FRAME_TTL_MS')

          once(
              '''        val pumpResult = runtime.pump.pump(nowEpochMs = now, maxChunks = 4) { wire ->\n            wifiPort.sendMediaChunkWire(runtime.peerId, wire)\n        }\n        if (pumpResult.sentIndices.isNotEmpty()) runtime.lastTransport = "wifi-local"''',
              '''        var chunkTransport: String? = null\n        val pumpResult = runtime.pump.pump(nowEpochMs = now, maxChunks = 4) { wire ->\n            val chunk = AndroidMediaChunkWireCodec.decode(wire)\n            val result = node.sendOriginEnvelope(\n                recipientId = runtime.peerId,\n                messageId = "media:${chunk.assetId}:${chunk.index}",\n                encodedEnvelope = wire,\n                nowEpochMs = now,\n                ttlMs = MESH_FRAME_TTL_MS,\n                hopLimit = 8\n            )\n            if (result.sent) chunkTransport = result.transportId\n            result.sent\n        }\n        if (pumpResult.sentIndices.isNotEmpty()) runtime.lastTransport = chunkTransport''',
              'tmc1 mesh send'
          )

          p.write_text(s)
          print('AndroidMediaTransferController multihop patch applied')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/android/app/src/main/java/com/telemetry/app/media/AndroidMediaTransferController.kt
          git commit -m 'feat(media): route encrypted chunks through mesh' || exit 0
          git push origin HEAD:feature/m1.5a-secure-media-foundation
