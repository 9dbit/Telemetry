name: iOS Preview Contract

on:
  pull_request:
    paths:
      - "mobile/ios-preview/**"
      - "mobile/contracts/**"
      - "test/ios-preview-contract.test.js"
      - ".github/workflows/ios-preview.yml"
  push:
    branches: [main]
    paths:
      - "mobile/ios-preview/**"
      - "mobile/contracts/**"
      - "test/ios-preview-contract.test.js"

jobs:
  validate-ios-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: mobile/ios-preview/package-lock.json
      - name: Install iOS preview JS dependencies
        working-directory: mobile/ios-preview
        run: npm install --package-lock-only && npm ci
      - name: Typecheck iOS preview shell
        working-directory: mobile/ios-preview
        run: npm run typecheck
      - name: Expo dependency diagnostics
        working-directory: mobile/ios-preview
        run: npx expo-doctor
