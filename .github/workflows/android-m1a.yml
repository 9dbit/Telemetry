name: Android M1A

on:
  pull_request:
    paths:
      - "mobile/android/**"
      - "mobile/contracts/**"
      - ".github/workflows/android-m1a.yml"
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - "mobile/contracts/**"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build and unit test M1A
        run: gradle -p mobile/android :app:testDebugUnitTest :app:assembleDebug --stacktrace
