name: Android Mobile

on:
  pull_request:
    paths:
      - "mobile/android/**"
      - "mobile/contracts/**"
      - ".github/workflows/android-m1a.yml"
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - "mobile/contracts/**"
      - ".github/workflows/android-m1a.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build and unit test Android
        run: gradle -p mobile/android :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload M1B debug APK
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-android-m1b-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
