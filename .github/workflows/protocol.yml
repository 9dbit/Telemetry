name: Protocol Core

on:
  pull_request:
    paths:
      - 'src/protocol/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/protocol.yml'
  push:
    branches:
      - main
    paths:
      - 'src/protocol/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/protocol.yml'

jobs:
  protocol-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Test protocol
        run: npm test
