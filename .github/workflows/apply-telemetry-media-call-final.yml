name: Apply Telemetry media and call hardware-tested sync

on:
  push:
    branches:
      - feature/ios-m1.5-media-runtime

permissions:
  contents: write

jobs:
  apply-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified hardware-tested snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 12 --retry-delay 3 'https://periodic-area-spotlight-acquire.trycloudflare.com/telemetry-ui-call-final.patch' -o /tmp/telemetry-ui-call-final.patch
          echo 'b1550064d547911178d992b6f29f867492e7a0d0c4ef9856c6e30d361caedd2a  /tmp/telemetry-ui-call-final.patch' | sha256sum -c -
          git apply --check /tmp/telemetry-ui-call-final.patch
          git apply /tmp/telemetry-ui-call-final.patch
          git rm -f .github/workflows/apply-telemetry-media-call-final.yml
          git add -u
          git add mobile/ios-preview/assets/icon.png
          git add -f mobile/ios-preview/ios/TelemetryiOSPreview/Images.xcassets/AppIcon.appiconset/App-Icon-1024x1024@1x.png
          git config user.name 'Telemetry Sync Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(ios): restore media previews and route peer call signaling'
          git push origin HEAD:feature/ios-m1.5-media-runtime
