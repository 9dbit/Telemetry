name: Restore Telemetry Native Snapshot

on:
  push:
    branches:
      - feature/ios-m1.5-media-runtime

permissions:
  contents: write

jobs:
  restore-native:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/ios-m1.5-media-runtime
          fetch-depth: 0

      - name: Download verified committed snapshot
        env:
          SNAPSHOT_URL: https://decimal-dawn-herbal-irc.trycloudflare.com/telemetry-head-bc622d1.tar.gz
          SNAPSHOT_SHA256: 42071e617405689b0a722995f985608109bd887ac2a1440612b890fab4277aae
        run: |
          set -euo pipefail
          curl -fsSL "$SNAPSHOT_URL" -o /tmp/telemetry-head.tar.gz
          echo "$SNAPSHOT_SHA256  /tmp/telemetry-head.tar.gz" | sha256sum -c -
          mkdir -p /tmp/telemetry-head
          tar -xzf /tmp/telemetry-head.tar.gz -C /tmp/telemetry-head

      - name: Restore exact ignored native files
        run: |
          set -euo pipefail
          files=(
            mobile/ios-preview/modules/telemetry-ios-native/ios/TelemetryMediaRuntime.swift
            mobile/ios-preview/modules/telemetry-ios-native/ios/TelemetryWifiTransport.swift
            mobile/ios-preview/modules/telemetry-ios-native/ios/cleng.wav
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            cp "/tmp/telemetry-head/$file" "$file"
            git add -f "$file"
          done
          git status --short

      - name: Commit exact native snapshot
        run: |
          set -euo pipefail
          git config user.name 'Telemetry Snapshot Sync'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Native snapshot already synchronized.'
            exit 0
          fi
          git commit -m 'fix(ios): restore native media and Wi-Fi runtime snapshot'
          git push origin HEAD:feature/ios-m1.5-media-runtime
