name: Apply iOS background message and gallery fix
on:
  push:
    branches: [feature/ios-m1.6-webrtc-mesh-gateways]
permissions:
  contents: write
jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ios-m1.6-webrtc-mesh-gateways
          fetch-depth: 0
      - name: Apply UI reconciliation and safe-area fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/ios-preview/App.tsx')
          s = p.read_text()
          replacements = [
            ("    const contact = contactsRef.current.find(item => item.deviceId === deviceId);\n    if (!contact) {\n      hydrateLocalState();\n      return;\n    }", "    let contact = contactsRef.current.find(item => item.deviceId === deviceId);\n    if (!contact) {\n      hydrateLocalState();\n      contact = contactsRef.current.find(item => item.deviceId === deviceId);\n    }\n    if (!contact) return;"),
            ("    hydrateLocalState();\n    refreshReliabilityDiagnostics();", "    hydrateLocalState();\n    setTimeout(() => {\n      const pendingDeviceId = Telemetry.consumePendingNotificationOpen();\n      if (!pendingDeviceId) return;\n      hydrateLocalState();\n      openConversationByDeviceId(pendingDeviceId);\n    }, 0);\n    refreshReliabilityDiagnostics();"),
            ("      Telemetry.addListener('onNotificationOpen', event => {\n        Telemetry.consumePendingNotificationOpen();", "      Telemetry.addListener('onNotificationOpen', event => {\n        hydrateLocalState();\n        Telemetry.consumePendingNotificationOpen();"),
            ("      hydrateLocalState();\n      void recoverPendingTransports();\n    });", "      hydrateLocalState();\n      const pendingDeviceId = Telemetry.consumePendingNotificationOpen();\n      if (pendingDeviceId) openConversationByDeviceId(pendingDeviceId);\n      void recoverPendingTransports();\n    });"),
            ("            <View style={[StyleSheet.absoluteFill, styles.mediaPanelOverlay, { zIndex: 240 }]}>\n", "            <SafeAreaView style={[StyleSheet.absoluteFill, styles.mediaPanelOverlay, { zIndex: 240 }]}>\n"),
            ("            </View>\n          )}\n\n          {!!mediaViewerAssetId && (", "            </SafeAreaView>\n          )}\n\n          {!!mediaViewerAssetId && ("),
            ("mediaPanelHeader: { height: 72, paddingHorizontal: 12,", "mediaPanelHeader: { height: 64, paddingHorizontal: 12,"),
            ("mediaPanelGrid: { paddingTop: 2, paddingBottom: 28 },", "mediaPanelGrid: { paddingTop: 6, paddingBottom: 28 },"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected source block not found: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify tests and TypeScript
        run: |
          npm ci
          npm test
          npm --prefix mobile/ios-preview ci
          npm --prefix mobile/ios-preview run typecheck
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "Telemetry Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-ios-background-gallery-fix.yml
          git add mobile/ios-preview/App.tsx
          git commit -m "fix(ios): reconcile background messages and gallery safe area"
          git push origin HEAD:feature/ios-m1.6-webrtc-mesh-gateways
